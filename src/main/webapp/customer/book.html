<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Vehicle</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand"><div class="brand-icon"><i class="fa-solid fa-car"></i></div><span>DriveEase Rentals</span></div>
        <nav><ul class="nav-links"><li><a href="../"><i class="fa-solid fa-house"></i> Fleet Catalog</a></li><li><a href="./dashboard.html"><i class="fa-solid fa-gauge"></i> My Dashboard</a></li><li><a href="./my-rentals.html"><i class="fa-solid fa-clock-rotate-left"></i> My Bookings</a></li><li><a href="./book.html" class="active"><i class="fa-solid fa-plus-circle"></i> Book Vehicle</a></li></ul></nav>
        <div class="nav-user"><div class="user-avatar" style="background: #0284c7;"><i class="fa-solid fa-user"></i></div><div><span class="user-name">John Smith</span><span class="badge badge-customer" style="margin-left: 0.25rem;">Customer</span></div><a href="../login.html" class="btn btn-secondary btn-sm" style="margin-left: 0.75rem;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a></div>
    </header>

    <main class="container">
        <div class="page-header"><div class="page-title"><h1>Book a Vehicle</h1><p>Select a vehicle and desired rental dates.</p></div></div>
        <div class="card form-card">
            <form action="./my-rentals.html" method="POST" class="form-grid">
                <div class="form-group"><label for="vehicleId">Select Vehicle <span class="required-star">*</span></label><select id="vehicleId" name="vehicleId"><option>CityDrive S - ₹3,800 / day</option><option>TrailBlazer X - ₹5,400 / day</option></select></div>
                <div class="form-group"><label for="rentalDate">Rental Start Date <span class="required-star">*</span></label><input type="date" id="rentalDate" name="rentalDate" value="2026-10-07" required></div>
                <div class="form-group"><label for="returnDate">Expected Return Date <span class="required-star">*</span></label><input type="date" id="returnDate" name="returnDate" value="2026-10-10" required></div>
                <div class="form-actions" style="grid-column: 1 / -1;">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-key"></i> Confirm Booking</button>
                    <a href="./dashboard.html" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
