<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand"><div class="brand-icon"><i class="fa-solid fa-car"></i></div><span>DriveEase Rentals</span></div>
        <nav><ul class="nav-links"><li><a href="../dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li><li><a href="../vehicles/list.html"><i class="fa-solid fa-car-side"></i> Vehicles</a></li><li><a href="./list.html" class="active"><i class="fa-solid fa-users"></i> Customers</a></li><li><a href="../rentals/list.html"><i class="fa-solid fa-file-invoice-dollar"></i> Rentals</a></li></ul></nav>
        <div class="nav-user"><div class="user-badge"><div class="user-avatar"><i class="fa-solid fa-user-shield"></i></div><span>Admin</span></div><a href="../login.html" class="btn btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></div>
    </header>

    <main class="container">
        <div class="page-header"><div class="page-title"><h1>Register Customer</h1><p>Create a new customer account.</p></div></div>
        <div class="card form-card">
            <form action="./list.html" method="POST" class="form-grid">
                <div class="form-group"><label for="name">Customer Name <span class="required-star">*</span></label><input type="text" id="name" name="name" value="" required></div>
                <div class="form-group"><label for="phone">Phone Number <span class="required-star">*</span></label><input type="text" id="phone" name="phone" value="" required></div>
                <div class="form-group"><label for="email">Email Address <span class="required-star">*</span></label><input type="email" id="email" name="email" value="" required></div>
                <div class="form-group"><label for="address">Address</label><input type="text" id="address" name="address" value=""></div>
                <div class="form-actions" style="grid-column: 1 / -1;">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Save Customer</button>
                    <a href="./list.html" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
