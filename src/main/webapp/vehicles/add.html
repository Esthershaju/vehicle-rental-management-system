<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand"><div class="brand-icon"><i class="fa-solid fa-car"></i></div><span>DriveEase Rentals</span></div>
        <nav><ul class="nav-links"><li><a href="../dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li><li><a href="./list.html" class="active"><i class="fa-solid fa-car-side"></i> Vehicles</a></li><li><a href="../customers/list.html"><i class="fa-solid fa-users"></i> Customers</a></li><li><a href="../rentals/list.html"><i class="fa-solid fa-file-invoice-dollar"></i> Rentals</a></li></ul></nav>
        <div class="nav-user"><div class="user-badge"><div class="user-avatar"><i class="fa-solid fa-user-shield"></i></div><span>Admin</span></div><a href="../login.html" class="btn btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></div>
    </header>

    <main class="container">
        <div class="page-header">
            <div class="page-title"><h1>Add New Vehicle</h1><p>Register a new vehicle in the fleet.</p></div>
        </div>
        <div class="card form-card">
            <form action="./list.html" method="POST" class="form-grid">
                <div class="form-group"><label for="vehicleNumber">Vehicle Number <span class="required-star">*</span></label><input type="text" id="vehicleNumber" name="vehicleNumber" value="" required></div>
                <div class="form-group"><label for="vehicleName">Vehicle Name <span class="required-star">*</span></label><input type="text" id="vehicleName" name="vehicleName" value="" required></div>
                <div class="form-group"><label for="vehicleType">Vehicle Type <span class="required-star">*</span></label><select id="vehicleType" name="vehicleType"><option>Sedan</option><option>SUV</option><option>Luxury</option><option>Electric</option></select></div>
                <div class="form-group"><label for="brand">Brand</label><input type="text" id="brand" name="brand" value=""></div>
                <div class="form-group"><label for="model">Model</label><input type="text" id="model" name="model" value=""></div>
                <div class="form-group"><label for="rentalPrice">Rental Price / day <span class="required-star">*</span></label><input type="number" id="rentalPrice" name="rentalPrice" value="" required></div>
                <div class="form-group"><label for="availabilityStatus">Availability Status</label><select id="availabilityStatus" name="availabilityStatus"><option>AVAILABLE</option><option>RENTED</option></select></div>
                <div class="form-actions" style="grid-column: 1 / -1;">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Vehicle</button>
                    <a href="./list.html" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
