<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Vehicle</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand"><div class="brand-icon"><i class="fa-solid fa-car"></i></div><span>DriveEase Rentals</span></div>
        <nav><ul class="nav-links"><li><a href="../dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li><li><a href="../vehicles/list.html"><i class="fa-solid fa-car-side"></i> Vehicles</a></li><li><a href="../customers/list.html"><i class="fa-solid fa-users"></i> Customers</a></li><li><a href="./list.html" class="active"><i class="fa-solid fa-file-invoice-dollar"></i> Rentals</a></li></ul></nav>
        <div class="nav-user"><div class="user-badge"><div class="user-avatar"><i class="fa-solid fa-user-shield"></i></div><span>Admin</span></div><a href="../login.html" class="btn btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></div>
    </header>

    <main class="container">
        <div class="page-header"><div class="page-title"><h1>Vehicle Return Confirmation</h1><p>Confirm vehicle return and settlement.</p></div></div>
        <div class="card form-card">
            <form action="./list.html" method="POST" class="form-grid">
                <div class="form-group"><label for="rentalId">Rental ID</label><input type="text" id="rentalId" name="rentalId" value="105" readonly></div>
                <div class="form-group"><label for="vehicleName">Vehicle</label><input type="text" id="vehicleName" name="vehicleName" value="TrailBlazer X" readonly></div>
                <div class="form-group"><label for="customerName">Customer</label><input type="text" id="customerName" name="customerName" value="Sarah Lee" readonly></div>
                <div class="form-group"><label for="returnDate">Actual Return Date <span class="required-star">*</span></label><input type="date" id="returnDate" name="returnDate" value="2026-10-07" required></div>
                <div class="form-group"><label for="totalAmount">Estimated Total Amount</label><input type="text" id="totalAmount" name="totalAmount" value="₹5,400" readonly></div>
                <div class="form-actions" style="grid-column: 1 / -1;">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-rotate-left"></i> Process Return</button>
                    <a href="./list.html" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
