<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Rental</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand"><div class="brand-icon"><i class="fa-solid fa-car"></i></div><span>DriveEase Rentals</span></div>
        <nav><ul class="nav-links"><li><a href="../dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li><li><a href="../vehicles/list.html"><i class="fa-solid fa-car-side"></i> Vehicles</a></li><li><a href="../customers/list.html"><i class="fa-solid fa-users"></i> Customers</a></li><li><a href="./list.html" class="active"><i class="fa-solid fa-file-invoice-dollar"></i> Rentals</a></li></ul></nav>
        <div class="nav-user"><div class="user-badge"><div class="user-avatar"><i class="fa-solid fa-user-shield"></i></div><span>Admin</span></div><a href="../login.html" class="btn btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></div>
    </header>

    <main class="container">
        <div class="page-header"><div class="page-title"><h1>Create New Rental</h1><p>Assign an available vehicle to a customer.</p></div></div>
        <div class="card form-card">
            <form action="./list.html" method="POST" class="form-grid">
                <div class="form-group"><label for="customerId">Customer <span class="required-star">*</span></label><select id="customerId" name="customerId"><option>John Smith</option><option>Sarah Lee</option></select></div>
                <div class="form-group"><label for="vehicleId">Vehicle <span class="required-star">*</span></label><select id="vehicleId" name="vehicleId"><option>CityDrive S</option><option>TrailBlazer X</option></select></div>
                <div class="form-group"><label for="rentalDate">Rental Start Date <span class="required-star">*</span></label><input type="date" id="rentalDate" name="rentalDate" value="2026-10-07" required></div>
                <div class="form-group"><label for="returnDate">Expected Return Date <span class="required-star">*</span></label><input type="date" id="returnDate" name="returnDate" value="2026-10-12" required></div>
                <div class="form-actions" style="grid-column: 1 / -1;">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-key"></i> Create Rental</button>
                    <a href="./list.html" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
